name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Unit and estimator checks
        run: python -m pytest -q
      - name: End-to-end CLI smoke test
        run: odc benchmark --config configs/benchmarks/dec_smoke.yaml

  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1,<2" "cffconvert>=2,<3" "check-wheel-contents>=0.6,<1" "twine>=5,<7"
      - run: cffconvert --validate
      - run: python -m build
      - run: python -m twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - run: python tools/check_dist.py dist
      - name: Install and import the wheel
        run: |
          python -m venv /tmp/odc-wheel-test
          /tmp/odc-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/odc-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/odc-wheel-test/bin/python -c "from opendeepclustering import DEC, IDEC"
          /tmp/odc-wheel-test/bin/odc --help

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
