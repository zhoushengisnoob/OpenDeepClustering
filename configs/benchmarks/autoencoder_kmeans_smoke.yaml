estimator: AutoencoderKMeans
seeds: [7]
dataset:
  kind: blobs
  params:
    n_samples: 120
    n_features: 8
    centers: 3
    cluster_std: 0.8
    random_state: 7
  normalization: unit
parameters:
  n_clusters: 3
  dims: [16, 3]
  max_epochs: 1
  batch_size: 32
  n_init: 3
  deterministic: true
  device: cpu
output: ../../benchmark_outputs/autoencoder_kmeans_smoke.json
