[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opendeepclustering"
version = "0.1.0"
description = "Scikit-learn style deep clustering estimators based on the OpenDeepClustering taxonomy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "munkres",
    "numpy",
    "scikit-learn",
    "torch",
]

[tool.setuptools.packages.find]
include = ["opendeepclustering*"]
