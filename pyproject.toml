[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opendeepclustering"
version = "0.1.0"
description = "Scikit-learn style deep clustering estimators based on the OpenDeepClustering taxonomy."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "OpenDeepClustering contributors"},
]
keywords = ["deep-clustering", "machine-learning", "pytorch", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23,<2",
    "PyYAML>=6,<7",
    "scikit-learn>=1.2,<1.8",
    "scipy>=1.9,<2",
    "torch>=2.0,<2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7,<9",
]
dev = [
    "build>=1,<2",
    "cffconvert>=2,<3",
    "check-wheel-contents>=0.6,<1",
    "pytest>=7,<9",
    "twine>=5,<7",
]
image = [
    "torchvision>=0.15,<0.21",
]
benchmark = [
    "torchvision>=0.15,<0.21",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25,<1",
]

[project.scripts]
odc = "opendeepclustering.cli:main"

[project.urls]
Documentation = "https://zhoushengisnoob.github.io/OpenDeepClustering/"
Issues = "https://github.com/zhoushengisnoob/OpenDeepClustering/issues"
Repository = "https://github.com/zhoushengisnoob/OpenDeepClustering"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["opendeepclustering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
